name: Run Tests

on: push

env:
  NODE_VERSION: 24

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x", "26.x"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run type check
        run: npm run lint:types

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-node-${{ matrix.node-version }}
          path: |
            coverage/
            reports/

  swagger-compatibility:
    name: Swagger ${{ matrix.swagger-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        swagger-version: ["12.0.0", "12.x"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Install @nestjs/swagger ${{ matrix.swagger-version }}
        run: |
          npm install --no-save "@nestjs/swagger@${{ matrix.swagger-version }}"
          installed=$(node -p "require('./node_modules/@nestjs/swagger/package.json').version")
          expected=$(npm view "@nestjs/swagger@${{ matrix.swagger-version }}" version --json | node -p "[].concat(JSON.parse(require('fs').readFileSync(0, 'utf8'))).pop()")
          echo "Installed @nestjs/swagger ${installed}, expected ${expected}"
          test "${installed}" = "${expected}"

      - name: Run type check
        run: npm run lint:types

      - name: Run unit tests
        run: npm run test:unit

      - name: Run Swagger E2E tests
        run: npm run test:e2e -- test/e2e/swagger.e2e.test.ts test/e2e/typed-query-swagger.e2e.test.ts

      - name: Load built package
        run: |
          node -e "require('./dist/cjs/index.js')"
          node --input-type=module -e "await import('./dist/esm/index.js')"
