name: Run Tests

on: push

env:
  NODE_VERSION: 24

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The development toolchain (testcontainers, lint-staged) needs Node >=22.22, so the full suite runs on
        # the latest release of each supported line; the consumer-smoke job covers the exact engines floors
        node-version: ["22.x", "24.x", "26.x"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run type check
        run: npm run lint:types

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-node-${{ matrix.node-version }}
          path: |
            coverage/
            reports/

  consumer-smoke:
    name: Consumer smoke (Node ${{ matrix.node-version }}${{ matrix.peer-floors && ', peer floors' || '' }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The engines floors ^22.13.0 || >=24.11.0 and the newest line
        node-version: ["22.13.0", "24.11.0", "26.x"]
        peer-floors: [false]
        # Every peer at the lower bound of its range, on the oldest supported Node.js
        include:
          - node-version: "22.13.0"
            peer-floors: true

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }} for the build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Setup Node.js ${{ matrix.node-version }} for the consumers
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run consumer smoke on the packed tarball
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          node --version
          npm run test:consumer -- --skip-build ${{ matrix.peer-floors && '--peer-floors' || '' }}

  swagger-compatibility:
    name: Swagger ${{ matrix.swagger-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        swagger-version: ["12.0.0", "12.x"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Install @nestjs/swagger ${{ matrix.swagger-version }}
        run: |
          npm install --no-save "@nestjs/swagger@${{ matrix.swagger-version }}"
          installed=$(node -p "require('./node_modules/@nestjs/swagger/package.json').version")
          expected=$(npm view "@nestjs/swagger@${{ matrix.swagger-version }}" version --json | node -p "[].concat(JSON.parse(require('fs').readFileSync(0, 'utf8'))).pop()")
          echo "Installed @nestjs/swagger ${installed}, expected ${expected}"
          test "${installed}" = "${expected}"

      - name: Run type check
        run: npm run lint:types

      - name: Run unit tests
        run: npm run test:unit

      - name: Run Swagger E2E tests
        run: npm run test:e2e -- test/e2e/swagger.e2e.test.ts test/e2e/typed-query-swagger.e2e.test.ts

      - name: Load built package
        run: |
          node --input-type=module -e "await import('./dist/index.js')"
          node --input-type=commonjs -e "require('./dist/index.js')"
